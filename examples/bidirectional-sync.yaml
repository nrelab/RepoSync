# Bidirectional sync example
#
# This example demonstrates bidirectional sync with loop prevention.
# Run with: reposync sync bidirectional-sync.yaml

pipeline:
  name: bidirectional-sync

# Internal repository (source of truth)
source:
  type: git
  url: /path/to/internal-repo
  ref: main

# Transform applied before pushing to public
transform:
  - filter:
      paths:
        - packages/sdk/**
        - LICENSE
  - move:
      from: packages/sdk
      to: .

# Public repository (mirror)
destination:
  type: git
  url: /path/to/public-repo
  branch: main

# Policy to prevent accidental overwrites
policy:
  deny:
    - "**/.env"
    - "**/credentials/**"
  max_deleted_files: 100

# Sync detects:
# - Forward: internal commits not yet in public (replayed with transforms)
# - Reverse: public commits not generated by RepoSync (treated as external changes)
# - Loop prevention: RepoSync-generated commits are never re-imported
