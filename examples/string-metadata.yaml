# Demonstrates the string/metadata transform kinds (PLAN M13 completion).
pipeline:
  name: "acme-internal-cleanup"

source:
  type: git
  url: git@github.com:acme/internal.git
  ref: main

transform:
  # Drop generated artifacts from the public mirror.
  - filter:
      paths:
        - "**/*.gen.ts"
        - "**/secrets/**"

  # Re-license the codebase for public release.
  - prepend:
      files: ["**/*.rs"]
      content: "// SPDX-License-Identifier: MIT\n"

  # Stamp a footer on READMEs.
  - append:
      files: ["README.md"]
      content: "\nGenerated by RepoSync.\n"

  # Normalize internal version tags.
  - regex_replace:
      files: ["**/Cargo.toml"]
      pattern: 'version = "0\.0\.0"'
      replacement: 'version = "0.1.0"'

  # Fix a typo introduced in an early commit.
  - patch:
      file: "docs/guide.md"
      patch: |
        @@ -1,3 +1,3 @@
         # Guide
        -Welcom to the project.
        +Welcome to the project.

  # Record release metadata on the snapshot.
  - metadata:
      key: "release"
      value: "public"

destination:
  type: git
  url: git@github.com:acme/internal-public.git
  branch: main
